# Input kalkulator TW-103: thermowell outlet uap reaktor R-101 (aliran S-105), ASME PTC 19.3 TW-2016.
# Dimensi = desain awal tipikal (belum dari datasheet vendor); diameter pipa S-105 belum ditetapkan (line sizing).
tag: TW-103
calculator: thermowell
description: TW-103 thermowell outlet uap R-101 (S-105), flanged tapered, uap metanol/DME/air 250 °C
standard: ASME PTC 19.3 TW-2016
inputs:
  # --- fluida (HMB) ---
  rho:    {stream: S-105, field: props_by_phase.vapor.rho, unit: kg/m3, symbol: ρ, label: Densitas uap}
  mu:     {stream: S-105, field: props_by_phase.vapor.mu, unit: cP, symbol: μ, label: Viskositas dinamis uap}
  P:      {stream: S-105, field: P, unit: bar(a), symbol: P, label: Tekanan operasi}
  m_flow: {stream: S-105, field: mass_flow, unit: kg/h, symbol: ṁ, label: Laju alir massa}
  pipe_id: {value: 154.08, unit: mm, symbol: D_pipa, label: Diameter dalam pipa S-105,
        source: "Asumsi 6 in Sch 40 (ASME B36.10M); line sizing S-105 belum dilakukan", status: PLACEHOLDER}
  # --- geometri (desain awal) ---
  shape:   {value: tapered, unit: "-", label: Bentuk shank, source: "Flanged tapered (Fig. 4-1-4), pilihan desain awal", status: ASUMSI}
  support: {value: flanged, unit: "-", label: Jenis pemasangan, source: "Flens ke nozzle pipa (§6-7(a)); compliance basis semi-tak-hingga (6-6-5)", status: ASUMSI}
  A: {value: 25.4, unit: mm, symbol: A, label: Diameter akar, source: "Ukuran tipikal 1 in; ganti dengan datasheet vendor", status: ASUMSI}
  B: {value: 19.1, unit: mm, symbol: B, label: Diameter tip, source: "Ukuran tipikal 3/4 in; ganti dengan datasheet vendor", status: ASUMSI}
  d: {value: 6.6, unit: mm, symbol: d, label: Diameter bor, source: "Bor 0,26 in untuk sensor 1/4 in (Tabel 4-1-1)", status: ASUMSI}
  L: {value: 200, unit: mm, symbol: L, label: Panjang tak tertumpu,
      source: "Usulan agent (LOG-035): sensitivitas pada geometri ini → L ≤ 220 mm lolos, 230 mm GAGAL (f_s > 0,4 f_n^c); 200 mm memberi margin. Tetapkan dari nozzle/piping oleh JN", status: ASUMSI}
  t: {value: 6.4, unit: mm, symbol: t, label: Tebal tip minimum, source: "Tipikal 1/4 in", status: ASUMSI}
  b: {value: 0, unit: mm, symbol: b, label: Radius fillet akar, source: "Tidak diketahui → 0 (§6-6)", status: STANDAR}
  # --- material: ASTM A182 F316 (kelas B) ---
  E:     {value: 178.6, unit: GPa, symbol: E, label: Modulus elastisitas 250 °C,
          source: "Tipikal austenitik ASME B31.1 Tabel C-1 (interpolasi 482 °F ≈ 25,9e6 psi); konfirmasi dari tabel kode yang berlaku", status: ASUMSI}
  E_ref: {value: 195, unit: GPa, symbol: E_ref, label: Modulus referensi kelas B, source: "§6-12.3 (material kelas B)", status: STANDAR}
  rho_m: {value: 8000, unit: kg/m3, symbol: ρ_m, label: Densitas material, source: "Densitas F316 (ref. [19] standar, seperti contoh 8-2)", status: LITERATUR}
  rho_s: {value: 2700, unit: kg/m3, symbol: ρ_s, label: Densitas sensor, source: "Nilai bawaan sensor MI (§6-5.3 langkah 5)", status: STANDAR}
  S:     {value: 115, unit: MPa, symbol: S, label: Tegangan izin maksimum 250 °C,
          source: "Perkiraan F316 pada 250 °C; ambil dari ASME B31.3 Tabel A-1 (kode pipa proses) sebelum dikutip", status: ASUMSI}
  Sf:    {value: 62.8, unit: MPa, symbol: S_f, label: Batas amplitudo fatik,
          source: "Tabel 6-12.3-1 kelas B 'welded, then machined' (thermowell flens)", status: ASUMSI}
  FE:    {value: 1.0, unit: "-", symbol: F_E, label: Faktor lingkungan, source: "Uap metanol/DME/air tanpa korosi khusus; tinjau ulang di HAZOP", status: ASUMSI}
  zeta:  {value: 0.0005, unit: "-", symbol: ζ, label: Faktor redaman, source: "§6-8.2 nilai konservatif", status: STANDAR}
  strouhal: {value: correlation, unit: "-", label: Metode Strouhal, source: "(6-4-2)", status: STANDAR}
