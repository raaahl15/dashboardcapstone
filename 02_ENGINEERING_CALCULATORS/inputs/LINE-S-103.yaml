  roughness: {value: 0.045, unit: mm, symbol: ε, label: Kekasaran absolut, source: "Baja komersial 0,045 mm (diagram Moody); konservatif untuk baja tahan karat", status: LITERATUR}
  v_max:  {value: 3.0, unit: m/s, symbol: V_maks, label: Kecepatan maksimum, source: "Cairan dipompa 1–3 m/s (Towler & Sinnott, Chemical Engineering Design, Tabel 5.3)", status: LITERATUR}
  dp_max: {value: 0.5, unit: bar/100 m, symbol: ΔP_maks, label: Penurunan tekanan maksimum, source: "Jalur discharge cairan, aturan praktis usulan agent (LOG-036)", status: ASUMSI}
