# Line sizing S-103 (line P-103 di DME-PID-002), LOG-036.
tag: S-103
calculator: line_sizing
description: "Line P-103: umpan gabungan (segar + recycle) ke E-101 (cair 25 °C, 15,5 bar)"
standard: ASME B36.10M; Darcy–Weisbach + Colebrook
inputs:
  m_flow:  {stream: S-103, field: mass_flow, unit: kg/h, symbol: ṁ, label: Laju alir massa}
