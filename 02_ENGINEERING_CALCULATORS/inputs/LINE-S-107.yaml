# Line sizing S-107 (line P-107 di DME-PID-002), LOG-036. Dua fase (fraksi uap molar 0,069): model homogen + API RP 14E.
tag: S-107
calculator: line_sizing
description: "Line P-107: keluaran E-102 ke battery limit Area 2 (dua fase 89 °C, 10,4 bar)"
standard: ASME B36.10M; Darcy–Weisbach + Colebrook; API RP 14E
inputs:
  m_flow:  {stream: S-107, field: mass_flow, unit: kg/h, symbol: ṁ, label: Laju alir massa}
  rho:     {stream: S-107, field: props.rho, unit: kg/m3, symbol: ρ_m, label: Densitas campuran homogen}
  y_v:     {stream: S-107, field: vapor_fraction, unit: "-", symbol: y_v, label: Fraksi uap molar}
  mw_v:    {stream: S-107, field: props_by_phase.vapor.mw, unit: kg/kmol, symbol: M_v, label: Massa molar uap}
  mw:      {stream: S-107, field: props.mw, unit: kg/kmol, symbol: M, label: Massa molar total}
  mu_v:    {stream: S-107, field: props_by_phase.vapor.mu, unit: cP, symbol: μ_v, label: Viskositas uap}
  mu_l:    {stream: S-107, field: props_by_phase.liquid.mu, unit: cP, symbol: μ_l, label: Viskositas cair}
  service: {value: two_phase, unit: "-", label: Jenis layanan, source: "HMB: fraksi uap 0,069", status: HMB}
  C:       {value: 100, unit: "-", symbol: C, label: Konstanta erosi, source: "API RP 14E: C = 100 untuk layanan kontinu tanpa padatan", status: LITERATUR}
  schedule:  {value: "40", unit: "-", label: Schedule pipa, source: "Sch 40 (ASME B36.10M), pilihan awal; tetapkan dari spesifikasi kelas pipa A1A", status: ASUMSI}
  roughness: {value: 0.045, unit: mm, symbol: ε, label: Kekasaran absolut, source: "Baja komersial 0,045 mm (diagram Moody); konservatif untuk baja tahan karat", status: LITERATUR}
  v_max:  {value: 15, unit: m/s, symbol: V_maks, label: Kecepatan maksimum, source: "Batas atas praktis dua fase; pembatas utama = V_e API RP 14E", status: ASUMSI}
  dp_max: {value: 0.5, unit: bar/100 m, symbol: ΔP_maks, label: Penurunan tekanan maksimum, source: "Aturan praktis usulan agent (LOG-036)", status: ASUMSI}
