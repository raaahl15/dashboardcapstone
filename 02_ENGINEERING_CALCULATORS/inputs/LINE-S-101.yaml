# Line sizing S-101 (line P-101 di DME-PID-002), LOG-036.
tag: S-101
calculator: line_sizing
description: "Line P-101: umpan metanol segar ke isap P-101 (cair 25 °C, 1 bar)"
standard: ASME B36.10M; Darcy–Weisbach + Colebrook
inputs:
  m_flow:  {stream: S-101, field: mass_flow, unit: kg/h, symbol: ṁ, label: Laju alir massa}
  rho:     {stream: S-101, field: props.rho, unit: kg/m3, symbol: ρ, label: Densitas}
  mu:      {stream: S-101, field: props.mu, unit: cP, symbol: μ, label: Viskositas dinamis}
  service: {value: liquid_suction, unit: "-", label: Jenis layanan, source: "HMB fasa cair; hulu P-101 (isap pompa)", status: HMB}
  schedule:  {value: "40", unit: "-", label: Schedule pipa, source: "Sch 40 (ASME B36.10M), pilihan awal; tetapkan dari spesifikasi kelas pipa A1A", status: ASUMSI}
  roughness: {value: 0.045, unit: mm, symbol: ε, label: Kekasaran absolut, source: "Baja komersial 0,045 mm (diagram Moody); konservatif untuk baja tahan karat", status: LITERATUR}
  v_max:  {value: 1.0, unit: m/s, symbol: V_maks, label: Kecepatan maksimum, source: "Jalur isap pompa ≤ 1 m/s (menjaga NPSH), aturan praktis usulan agent (LOG-036)", status: ASUMSI}
  dp_max: {value: 0.1, unit: bar/100 m, symbol: ΔP_maks, label: Penurunan tekanan maksimum, source: "Jalur isap pompa, aturan praktis usulan agent (LOG-036)", status: ASUMSI}
