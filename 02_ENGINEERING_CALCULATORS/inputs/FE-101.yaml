# Input kalkulator orifice FE-101 (loop FIC-101, umpan metanol di discharge P-101).
# Nilai bersumber HMB diambil otomatis; nilai lain WAJIB punya sumber + status (Blueprint §1.3).
tag: FE-101
calculator: orifice
description: Orifice plate FE-101 untuk FIC-101, umpan metanol cair di discharge P-101 (jalur 6"-PL-101)
standard: ISO 5167-2:2022
inputs:
  q_m:   {stream: S-102, field: mass_flow, symbol: q_m, label: Laju alir massa normal}
  P1:    {stream: S-102, field: P, symbol: P1, label: Tekanan hulu}
  T1:    {stream: S-102, field: T, symbol: T1, label: Suhu hulu}
  rho:   {stream: S-102, field: props_by_phase.liquid.rho, unit: kg/m3, symbol: rho, label: Densitas cairan}
  mu:    {stream: S-102, field: props_by_phase.liquid.mu, unit: cP, symbol: mu, label: Viskositas cairan}
  phase: {value: liquid, unit: "-", source: "hmb_streams.json S-102 vapor_fraction = 0", status: HMB, label: Fase fluida}
  D:     {value: 154.08, unit: mm, symbol: D, label: Diameter dalam pipa,
          source: "ASME B36.10M 6 in Sch 40; ukuran jalur dari nomor 6\"-PL-101 di Master Instrument Index (data contoh, belum dari line sizing)",
          status: PLACEHOLDER}
  dP:    {value: 25.0, unit: kPa, symbol: dP, label: Beda tekanan desain pada laju normal,
          source: "Pilihan rentang DP transmitter (0-25 kPa), dipertahankan dari CSV lama; perlu ditetapkan PIC",
          status: ASUMSI}
  taps:  {value: flange, unit: "-", label: Jenis pengambilan tekanan,
          source: "ISO 5167-2 §5.2.1 (flange taps umum di industri); konfirmasi dengan spesifikasi orifice flange",
          status: ASUMSI}
